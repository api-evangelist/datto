aid: datto
name: Datto
description: >-
  Datto is a data-protection and IT-management vendor for managed service
  providers (MSPs) and internal IT teams, now part of Kaseya. Its platform spans
  business continuity and disaster recovery (SIRIS, ALTO, Endpoint Backup),
  SaaS Protection for Microsoft 365 and Google Workspace, Remote Monitoring and
  Management (Datto RMM), Autotask professional services automation (PSA),
  networking (Wi-Fi, switches, firewalls, Secure Edge), and cybersecurity
  (Managed SOC, EDR, antivirus). Datto RMM publishes a versioned REST API (v2,
  OpenAPI 3.1) with platform-specific regional hosts on the CentraStage
  infrastructure, OAuth 2.0 access tokens, request-rate limiting, and paginated
  responses, letting partners programmatically manage sites, devices, alerts,
  jobs, audits, and account variables. Datto runs a formal Developer Program
  offering sandbox environments, technical enablement, and an integrations
  marketplace for vendors building on its solutions.
